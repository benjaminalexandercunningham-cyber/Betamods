name: Build packs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate and build
        run: python3 tools/build.py
      - name: Syntax-check scripts
        run: |
          for f in $(find packs -name '*.js'); do
            cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs || { echo "syntax error in $f"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: packs
          path: dist/
