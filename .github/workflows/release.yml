name: Release

# Runs when a tag like v1.0.0 is pushed, or when a release with a new tag is
# published from the GitHub website or app. Builds every pack and attaches the
# files to the release for that tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release files
        run: python3 tools/build.py --release "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file docs/REALM_SETUP.md --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
